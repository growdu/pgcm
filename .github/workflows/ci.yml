name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go · vet + test + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -race -timeout=120s
      - name: build (no embed)
        run: go build -o bin/pgcm-noembed ./cmd/pgcm
        # Note: full build needs web/dist; done in a separate job below.

  frontend:
    name: Web · install + typecheck + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: pnpm install
        working-directory: web
        run: pnpm install
      - name: pnpm typecheck
        working-directory: web
        run: pnpm typecheck
      - name: pnpm build
        working-directory: web
        run: pnpm build
      - name: upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  binary:
    name: Binary · full build (frontend embedded)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: download web/dist
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: go mod tidy
        run: go mod tidy
      - name: sync web/dist → cmd/pgcm/static
        run: |
          rm -rf cmd/pgcm/static
          mkdir -p cmd/pgcm/static
          cp -R web/dist/. cmd/pgcm/static/
      - name: go build with embedded frontend
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" -o bin/pgcm ./cmd/pgcm
      - name: smoke test (--help)
        run: ./bin/pgcm --help
      - name: smoke test (--listen then curl /healthz)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          ./bin/pgcm --listen 127.0.0.1:18080 &
          PGCM_PID=$!
          sleep 2
          curl -fsS http://127.0.0.1:18080/healthz | tee /tmp/healthz.json
          echo
          test "$(jq -r .status /tmp/healthz.json)" = "ok"
          kill $PGCM_PID
          wait $PGCM_PID 2>/dev/null || true
      - name: upload binary
        uses: actions/upload-artifact@v4
        with:
          name: pgcm-bin
          path: bin/pgcm
          retention-days: 14
